apiVersion: v1
kind: ConfigMap
metadata:
  name: tracepr-config
  namespace: tracepr
  labels:
    app: tracepr
data:
  # Application Configuration
  PRD_FILE: "./prd.md"
  OUTPUT_FORMAT: "markdown"
  MAX_DIFF_SIZE: "10000"
  PORT: "8080"
  MAX_COMMENTS: "10"
  
  # Claude AI Configuration
  CLAUDE_MODEL: "claude-3-7-sonnet-20250219"
  CLAUDE_BASE_URL: "https://api.anthropic.com/v1/messages"
  
  # Monitoring URLs
  PROMETHEUS_ALERTMANAGER_URL: "http://prometheus-alertmanager:9093"
  PROMETHEUS_CONFIG_PATH: "./alerts/prometheus/rules"
  AMPLITUDE_URL: "https://amplitude.com"
  
  # Logging Configuration
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  
  # Environment
  ENVIRONMENT: "production" 