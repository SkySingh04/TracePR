apiVersion: v1
kind: Service
metadata:
  name: tracepr-service
  namespace: tracepr
  labels:
    app: tracepr
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: tracepr
---
apiVersion: v1
kind: Service
metadata:
  name: tracepr-headless
  namespace: tracepr
  labels:
    app: tracepr
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: tracepr 