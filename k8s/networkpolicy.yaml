apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tracepr-network-policy
  namespace: tracepr
  labels:
    app: tracepr
spec:
  podSelector:
    matchLabels:
      app: tracepr
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS traffic for external APIs
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP traffic for internal services
  - to: []
    ports:
    - protocol: TCP
      port: 80
  # Allow access to Kubernetes API
  - to: []
    ports:
    - protocol: TCP
      port: 6443
  # Allow access to monitoring services
  - to:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 9093 