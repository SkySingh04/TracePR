apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracepr
  namespace: tracepr
  labels:
    app: tracepr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tracepr-role
  namespace: tracepr
  labels:
    app: tracepr
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tracepr-rolebinding
  namespace: tracepr
  labels:
    app: tracepr
subjects:
- kind: ServiceAccount
  name: tracepr
  namespace: tracepr
roleRef:
  kind: Role
  name: tracepr-role
  apiGroup: rbac.authorization.k8s.io 